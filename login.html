<!DOCTYPE html>
<html lang="en" class="scroll-smooth overflow-x-clip">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Client Sign In - Taxora Advisory</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%23123B5D'/><text x='50%' y='52%' dominant-baseline='central' text-anchor='middle' font-family='Arial, sans-serif' font-weight='900' font-size='24' fill='white'>₹</text></svg>">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Plus Jakarta Sans"', 'sans-serif'],
                    }
                }
            }
        }
    </script>
</head>

<body
    class="min-h-screen w-full overflow-x-clip font-sans bg-[#FAFBFD] text-[#17212B] transition-colors duration-300 dark:bg-[#07131F] dark:text-white flex flex-col justify-between">

    <header class="w-full max-w-[1440px] mx-auto px-6 sm:px-8 pt-6 flex items-center justify-end gap-3">
        <button type="button" dir="ltr" onclick="toggleDarkMode()" aria-label="Toggle Theme"
            class="themeToggleBtn relative flex h-8 w-[70px] items-center justify-between rounded-full border border-gray-300 bg-white/10 px-2 transition-colors duration-300 dark:border-gray-700 dark:bg-[#162B3D] shrink-0">
            <span class="text-xs select-none leading-none z-10">☀</span>
            <span id="themeKnobEl"
                class="themeKnob pointer-events-none absolute left-0.5 top-1 flex h-6 w-6 items-center justify-center rounded-full bg-white shadow-md transition-transform duration-300 ease-out dark:bg-blue-600"></span>
            <span class="text-xs select-none leading-none z-10">☾</span>
        </button>

        <button type="button" aria-label="Toggle Direction"
            class="directionToggleBtn h-8 min-w-[70px] rounded-full border border-gray-200 bg-white px-3 text-[13px] font-medium tracking-[0.04em] text-[#334155] transition duration-200 hover:border-[#D5E3EC] hover:bg-[#EAF2F7] hover:text-[#123B5D] dark:border-gray-600 dark:bg-[#162B3D] dark:text-gray-200 dark:hover:bg-[#20394E] dark:hover:text-white">
            LTR
        </button>

    </header>

    <main class="flex-grow flex items-center justify-center px-4 sm:px-6 py-6 sm:py-8">
        <div class="w-full max-w-[460px]">
            <div
                class="rounded-3xl border border-gray-200 bg-white p-7 sm:p-10 shadow-xl transition-all dark:border-gray-800 dark:bg-[#0D1B2A]">
                <div class="text-center">
                    <a href="index.html" class="flex shrink-0 items-center justify-center gap-[10px] text-[#123B5D] dark:text-white">
                    <span
                        class="flex h-9 w-9 shrink-0 items-center justify-center rounded-[10px] bg-[#123B5D] text-xl text-white">₹</span>
                    <span class="flex flex-col gap-1 leading-[1.2]">
                        <span
                            class="-translate-x-0.5 text-[20px] font-bold tracking-[0.08em] text-[#123B5D] dark:text-white">TAXORA</span>
                   </a>

                    <h1 class="mt-4 text-2xl sm:text-3xl font-extrabold text-[#17212B] dark:text-white">
                        Welcome Back
                    </h1>
                    <p class="mt-1.5 text-xs sm:text-sm text-[#64748B] dark:text-gray-400">
                        Access your filings, notice tracker & CA advisory bench.
                    </p>
                </div>

                <form id="loginForm" class="mt-8 space-y-4">
                    <div>
                        <label class="block text-xs font-bold text-[#17212B] dark:text-gray-300">
                            PAN or Registered Email *
                        </label>
                        <div class="relative mt-1.5">
                            <input type="text" required placeholder="e.g. ABCPK1234F or client@mail.com"
                                class="w-full rounded-xl border border-gray-200 bg-[#FBFDFF] px-4 py-3 text-xs sm:text-sm text-[#17212B] focus:border-[#123B5D] focus:outline-none dark:border-gray-700 dark:bg-[#102235] dark:text-white pl-10">
                            <svg class="absolute left-3.5 top-3.5 h-4 w-4 text-gray-400" fill="none" viewBox="0 0 24 24"
                                stroke="currentColor" stroke-width="2">
                                <path stroke-linecap="round" stroke-linejoin="round"
                                    d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
                            </svg>
                        </div>
                    </div>

                    <div>
                        <div class="flex items-center justify-between">
                            <label class="block text-xs font-bold text-[#17212B] dark:text-gray-300">
                                Password *
                            </label>
                            <a href="#"
                                class="text-[11px] font-semibold text-[#123B5D] hover:underline dark:text-blue-400">
                                Forgot password?
                            </a>
                        </div>
                        <div class="relative mt-1.5">
                            <input id="loginPasswordInput" type="password" required placeholder="••••••••••••"
                                class="w-full rounded-xl border border-gray-200 bg-[#FBFDFF] px-4 py-3 text-xs sm:text-sm text-[#17212B] focus:border-[#123B5D] focus:outline-none dark:border-gray-700 dark:bg-[#102235] dark:text-white pl-10 pr-10">
                            <svg class="absolute left-3.5 top-3.5 h-4 w-4 text-gray-400" fill="none" viewBox="0 0 24 24"
                                stroke="currentColor" stroke-width="2">
                                <path stroke-linecap="round" stroke-linejoin="round"
                                    d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
                            </svg>
                            <button type="button" data-target="loginPasswordInput"
                                class="password-toggle-btn absolute right-3.5 top-3.5 text-gray-400 hover:text-gray-600 dark:hover:text-gray-200 cursor-pointer">
                                <svg class="h-4 w-4 pointer-events-none" fill="none" viewBox="0 0 24 24"
                                    stroke="currentColor" stroke-width="2">
                                    <path stroke-linecap="round" stroke-linejoin="round"
                                        d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                                    <path stroke-linecap="round" stroke-linejoin="round"
                                        d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                                </svg>
                            </button>
                        </div>
                    </div>

                    <div class="flex items-center gap-2 pt-1">
                        <input type="checkbox" id="rememberMe"
                            class="h-4 w-4 rounded border-gray-300 text-[#123B5D] focus:ring-[#123B5D] dark:border-gray-700 dark:bg-[#102235]">
                        <label for="rememberMe" class="text-xs text-[#64748B] dark:text-gray-400">
                            Keep me logged in on this device
                        </label>
                    </div>

                    <button type="submit"
                        class="w-full mt-2 rounded-xl bg-[#123B5D] py-3.5 text-xs sm:text-sm font-bold text-white shadow-lg transition-all duration-200 hover:bg-[#0c283f] hover:shadow-xl active:scale-95 dark:bg-blue-600 dark:hover:bg-blue-500">
                        Secure Client Sign In →
                    </button>

                    <div class="relative my-6">
                        <div class="absolute inset-0 flex items-center">
                            <div class="w-full border-t border-gray-200 dark:border-gray-800"></div>
                        </div>
                        <div class="relative flex justify-center text-xs uppercase">
                            <span class="bg-white px-3 font-bold text-[#64748B] dark:bg-[#0D1B2A] dark:text-gray-400">
                                Or sign in with
                            </span>
                        </div>
                    </div>

                    <div class="grid grid-cols-3 gap-3">
                        <button type="button"
                            class="flex items-center justify-center gap-2 rounded-xl border border-gray-200 bg-white py-2.5 text-xs font-semibold text-[#17212B] shadow-xs transition hover:bg-gray-50 dark:border-gray-700 dark:bg-[#102235] dark:text-white dark:hover:bg-[#152e47]">
                            <svg class="h-4 w-4" viewBox="0 0 24 24">
                                <path fill="#4285F4"
                                    d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" />
                                <path fill="#34A853"
                                    d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" />
                                <path fill="#FBBC05"
                                    d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z" />
                                <path fill="#EA4335"
                                    d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z" />
                            </svg>
                            <span class="hidden sm:inline">Google</span>
                        </button>

                        <button type="button"
                            class="flex items-center justify-center gap-2 rounded-xl border border-gray-200 bg-white py-2.5 text-xs font-semibold text-[#17212B] shadow-xs transition hover:bg-gray-50 dark:border-gray-700 dark:bg-[#102235] dark:text-white dark:hover:bg-[#152e47]">
                            <svg class="h-4 w-4 text-pink-600 dark:text-pink-400" fill="currentColor"
                                viewBox="0 0 24 24">
                                <path
                                    d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zm0-2.163c-3.259 0-3.667.014-4.947.072-4.358.2-6.78 2.618-6.98 6.98-.059 1.281-.073 1.689-.073 4.948 0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98 1.281.058 1.689.072 4.948.072 3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98-1.281-.059-1.69-.073-4.949-.073zm0 5.838c-3.403 0-6.162 2.759-6.162 6.162s2.759 6.163 6.162 6.163 6.162-2.759 6.162-6.163c0-3.403-2.759-6.162-6.162-6.162zm0 10.162c-2.209 0-4-1.79-4-4 0-2.209 1.791-4 4-4s4 1.791 4 4c0 2.21-1.791 4-4 4zm6.406-11.845c-.796 0-1.441.645-1.441 1.44s.645 1.44 1.441 1.44c.795 0 1.439-.645 1.439-1.44s-.644-1.44-1.439-1.44z" />
                            </svg>
                            <span class="hidden sm:inline">Instagram</span>
                        </button>

                        <button type="button"
                            class="flex items-center justify-center gap-2 rounded-xl border border-gray-200 bg-white py-2.5 text-xs font-semibold text-[#17212B] shadow-xs transition hover:bg-gray-50 dark:border-gray-700 dark:bg-[#102235] dark:text-white dark:hover:bg-[#152e47]">
                            <svg class="h-4 w-4" fill="currentColor" viewBox="0 0 24 24">
                                <path
                                    d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.81-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M15.97 6.37c.61-.75 1.04-1.8 0.92-2.87-.93.04-2.02.63-2.66 1.38-.56.65-1.06 1.73-.93 2.76 1.04.08 2.06-.52 2.67-1.27z" />
                            </svg>
                            <span class="hidden sm:inline">Apple</span>
                        </button>
                    </div>
                </form>

                <div class="mt-7 border-t border-gray-100 pt-6 text-center dark:border-gray-800">
                    <p class="text-xs text-[#64748B] dark:text-gray-400">
                        Don't have a client account?
                        <a href="register.html" class="font-bold text-[#123B5D] hover:underline dark:text-blue-400">
                            Create an account
                        </a>
                    </p>
                </div>
            </div>

            <p class="mt-6 text-center text-[11px] text-[#64748B] dark:text-gray-500">
                Protected by 256-bit SSL encryption & ICAI confidentiality bylaws.
            </p>
        </div>
    </main>

    <footer class="py-5 text-center text-xs text-[#64748B] dark:text-gray-500">
        © 2026 Taxora Advisory. All rights reserved.
    </footer>

    <script src="app.js"></script>
</body>

</html>
